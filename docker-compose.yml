services:
  build:
    build: .
    image: social-media-sentiment-adapter
    command:
      - /bin/sh
      - -c
      - |
        find /app/output_v3 -mindepth 1 -maxdepth 1 -type f -delete
        exec python create_knowledge_graph.py
    volumes:
      - ./data:/app/data:ro
      - ./output_v3:/app/output_v3

  import:
    image: neo4j:5.26-community
    depends_on:
      build:
        condition: service_completed_successfully
    working_dir: /var/lib/neo4j
    entrypoint:
      - /bin/bash
      - /app/output_v3/neo4j-admin-import-call.sh
    environment:
      HEAP_SIZE: 1G
    volumes:
      - ./output_v3:/app/output_v3:ro
      - neo4j_data:/data

  neo4j:
    image: neo4j:5.26-community
    depends_on:
      import:
        condition: service_completed_successfully
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: